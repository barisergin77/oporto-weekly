# Thursday 09:15 and 09:45 UTC — two passes, 30 min apart. Each run caps
# at 10 events so it can't time out (image generation can take ~25s per
# event × 10 = 250s, under Vercel's 300s ceiling). A typical Thursday has
# ~16 new events to image; two passes clear them all with headroom.
#
# Also schedule-dispatched: run on demand to backfill.
name: Cron · Event Images

on:
  schedule:
    - cron: '15 9 * * 4' # Thu 09:15 UTC (pass 1)
    - cron: '45 9 * * 4' # Thu 09:45 UTC (pass 2 — catches what pass 1 didn't fit)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/event-images
        run: |
          response=$(curl -s -X POST -w "\nHTTP_STATUS:%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/event-images)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Event images cron failed with HTTP $status"
            exit 1
          fi
