# Daily forward event scan (growth backlog #20) = the newsletter's DAILY
# RESEARCH since 2026-10-25: publishes notable Porto events from tomorrow to
# 10 weeks ahead AND covers the coming edition week (Thu–Wed) thoroughly, each
# confirmed on its official page. Thursday's edition is composed from these.
#
# Schedule: 07:00 UTC Fri–Wed; Thursday 05:30 UTC so it commits before the
# 07:45 composition (cron-newsletter-test.yml) and the 08:00 cascade. The
# route refuses to run in the newsletter freeze (Wed 18:00 → Thu 23:59 UTC)
# except Thursday before 07:30, so a late-firing Thursday run is a no-op.
# Writes data/events/*.json only → published by deploy-flush (21:00 UTC).
name: Cron · Forward Event Scan

on:
  schedule:
    - cron: '0 7 * * 0-3,5,6' # 07:00 UTC, every day but Thursday
    - cron: '30 5 * * 4'       # Thu 05:30 UTC — before the 07:45 composition
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/forward-scan
        run: |
          response=$(curl -s -X POST -w "\nHTTP_STATUS:%{http_code}" --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/forward-scan)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Forward scan cron failed with HTTP $status"
            exit 1
          fi
