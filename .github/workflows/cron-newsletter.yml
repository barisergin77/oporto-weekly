# Thursday newsletter cascade — single orchestrating workflow.
#
# Why one workflow instead of independent schedules: GitHub's scheduler
# routinely fires crons hours late and OUT OF ORDER (2026-06-11: the
# 08:00 EN cron fired at 12:04; PT, scheduled 08:15, fired at 12:17 —
# pure luck it came second). The cascade has hard ordering dependencies:
#   EN generate+archive → deploy live → EN send → PT translate+send
#   → Instagram
# Sequential steps in one workflow enforce that order regardless of
# scheduler behaviour. The downstream workflows (cron-newsletter-pt,
# cron-instagram) keep their own schedules as
# backups — every endpoint is ledger-claim-guarded, so whichever
# trigger arrives first does the work and the rest are no-ops.
#
# 2026-10-25: cron-newsletter-test.yml (Thu 07:45, same concurrency group)
# usually generates + archives the edition first and mails the owner a test
# copy; step 1 here then returns "already-archived" and the cascade goes
# straight to the send. If that early run failed or didn't fire, step 1
# generates exactly as before.
#
# All curls: POST (mutating endpoints; GETs may be retried by
# infrastructure — suspected cause of the 2026-05-21 double-pipeline)
# with --retry for transient network failures (safe: ledger-idempotent).
name: Cron · Newsletter (EN)

on:
  schedule:
    - cron: '0 8 * * 4' # Thu 08:00 UTC
  workflow_dispatch: # allow manual trigger from GitHub UI

concurrency:
  group: cron-newsletter
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 1. Generate + archive (/api/cron/newsletter)
        run: |
          response=$(curl -s --retry 2 --retry-delay 10 -w "\nHTTP_STATUS:%{http_code}" --max-time 320 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/newsletter)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Newsletter generation failed with HTTP $status"
            exit 1
          fi

      - name: 2. Send after deploy is live (/api/cron/newsletter-send)
        run: |
          response=$(curl -s --retry 2 --retry-delay 10 -w "\nHTTP_STATUS:%{http_code}" --max-time 320 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/newsletter-send)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Newsletter send failed with HTTP $status"
            exit 1
          fi

      - name: 3. PT translate + send (/api/cron/newsletter-pt)
        run: |
          response=$(curl -s --retry 2 --retry-delay 10 -w "\nHTTP_STATUS:%{http_code}" --max-time 320 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/newsletter-pt)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::PT newsletter failed with HTTP $status"
            exit 1
          fi

      - name: 4. Instagram post (/api/cron/instagram)
        # IG failure shouldn't fail the whole cascade — the watchdog retries it.
        continue-on-error: true
        run: |
          response=$(curl -s --retry 2 --retry-delay 10 -w "\nHTTP_STATUS:%{http_code}" --max-time 320 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://oportoweekly.com/api/cron/instagram)
          status=$(echo "$response" | tail -n1 | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Instagram cron failed with HTTP $status (watchdog will retry)"
            exit 1
          fi
